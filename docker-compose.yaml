services:
  idrolog-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: idrolog-server
    ports:
      - "7000:7000"
    volumes:
      - ./data:/data
      - ./config:/config:ro
      - ./config.properties:/app/config.properties
    environment:
      - DB_PATH=/data/idrolog.db
      - CONFIG_PATH=/config/server.properties
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
